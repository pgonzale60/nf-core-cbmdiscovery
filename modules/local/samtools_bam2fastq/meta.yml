name: "samtools_bam2fastq"
description: "Convert unaligned BAM to gzipped FASTQ on the fly"
keywords:
  - samtools
  - bam
  - fastq
tools:
  - samtools:
      description: "Tools for manipulating next-generation sequencing data"
      homepage: "https://www.htslib.org/"
      documentation: "https://www.htslib.org/doc/samtools.html"
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:true ]`
    - bam:
        type: file
        description: Unaligned BAM file
        pattern: "*.bam"
output:
  - fastq:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.fastq.gz":
          type: file
          description: Converted gzipped FASTQ file
          pattern: "*.fastq.gz"
  - versions_samtools:
      - "${task.process}":
          type: string
          description: Process name
      - samtools:
          type: string
          description: Tool name
      - "eval(...)":
          type: string
          description: Tool version
authors:
  - "@pgonzale60"
